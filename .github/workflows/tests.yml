name: tests

# Minimal, deliberately partial CI.
#
# It runs ONLY the two suites that are known-green with the real dependency set
# from a clean checkout:
#
#   * `test_timed_ownership.py` — the ownership / late-delivery-rollback suite
#     (`pip install -r requirements.txt pytest`, no secrets, no Discord socket).
#   * `npm test` — the hand-written Node harnesses for the dashboard JS
#     (`scripts/run_js_tests.sh`; node only, no npm dependencies).
#
# The remaining root and `scripts/` Python suites are script-style harnesses
# with documented pre-existing failures (4 of 72 `scripts/test_*.py`, 30 of 41
# root `test_*.py` under pytest — see the audit report). They are NOT gated
# here: a red build must mean a real regression, not a known-broken file.
# Widen this workflow only after those files are green.

# Pull requests only: a branch push must not start a build. CI runs when the
# change is proposed for review, which is the point at which the result is
# attached to a decision. Run `python -m pytest test_timed_ownership.py` and
# `npm test` locally before pushing; nothing here does it for you.
on:
  pull_request:

# No step needs to write to the repository or read secrets; both jobs only run
# the checked-out code. Declare that explicitly instead of inheriting the
# repository default (which can be read/write).
permissions:
  contents: read

jobs:
  python-ownership:
    runs-on: ubuntu-latest
    # A suite that never exits must fail the check, not sit "in progress" until
    # the runner's 6-hour ceiling. The step below is the real bound; this is the
    # backstop (install + suite, with room to spare).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Ownership / rollback suite
        # `-v` names each test as it completes, so a hang shows the last test
        # reached. `timeout -s ABRT` bounds the step and, with faulthandler
        # enabled, dumps every thread's stack on the way out - that is what
        # distinguishes "still running a test" from "finished, stuck in
        # interpreter shutdown". This is a diagnostic bound, not a fix: a
        # genuine hang still fails the job (exit 124/134).
        run: PYTHONFAULTHANDLER=1 timeout -s ABRT 600 python -m pytest -v --tb=short test_timed_ownership.py

  js-harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node harnesses
        run: npm test
